# Smithery configuration for Conector MCP.AI para C6 Bank
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_c6

name: c6-mcp
displayName: "Conector MCP.AI para C6 Bank"
description: >
  Conecte sua conta do **C6 Bank** ao Claude, ChatGPT e agentes de IA via Open Finance Brasil. Pergunte sobre saldos, extratos, faturas de cartão e investimentos do C6 Bank em linguagem natural. Regulado pelo Banco Central, somente leitura.

version: 0.1.1
license: MIT
homepage: https://github.com/mcp-dir/c6-mcp
repository: https://github.com/mcp-dir/c6-mcp

tags:
  - c6-bank
  - open-finance
  - open-banking
  - banking
  - brazil
  - finance
  - fintech
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_c6

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_c6/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
